<section id="skills" class="py-28 px-6 bg-[#07080d] relative overflow-hidden grid-bg">
  <div class="relative z-10 max-w-7xl mx-auto">
    <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-8 mb-12">
      <div>
        <p class="text-[#7c6ff7] text-sm font-semibold tracking-widest uppercase mb-4">
          Technical skills
        </p>
        <h2 class="font-display text-4xl md:text-6xl font-bold max-w-3xl leading-[0.98]">
          A command palette for <span class="gradient-text">secure SaaS delivery</span>.
        </h2>
      </div>

      <div class="flex flex-wrap gap-2">
        @for (filter of filters; track filter) {
          <button
            (click)="setActive(filter)"
            [ngClass]="active() === filter ? 'bg-[#7c6ff7] text-white border-[#7c6ff7]' : 'bg-white/5 text-[#a8adbd] border-white/10 hover:border-[#22d3a5]/50 hover:text-[#f7f8ff]'"
            class="px-4 py-2 rounded-lg border text-sm font-medium transition-all duration-300 cursor-pointer">
            {{ filter }}
          </button>
        }
      </div>
    </div>

    <div class="cinema-shell p-4 md:p-5">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      @for (cat of visibleCategories(); track cat.name) {
        <div class="skill-card spotlight-card rounded-xl border border-white/10 bg-white/[0.045] p-6 hover:-translate-y-1 group overflow-hidden transition-transform duration-300">
          <div class="flex items-start justify-between gap-4 mb-5">
            <div class="flex items-center gap-3">
              <span class="w-11 h-11 rounded-lg border border-white/10 bg-white/5 flex items-center justify-center text-xs font-bold tracking-wide"
                [style.color]="cat.color">
                {{ cat.icon }}
              </span>
              <div>
                <h3 class="font-display font-semibold text-xl text-[#f7f8ff]">{{ cat.name }}</h3>
                <p class="text-[#a8adbd] text-xs mt-1">Resume skill cluster</p>
              </div>
            </div>
            <span class="text-sm font-semibold" [style.color]="cat.color">{{ cat.level }}%</span>
          </div>

          <div class="relative h-2 rounded-full bg-white/8 overflow-hidden mb-5">
            <div class="absolute inset-y-0 left-0 rounded-full shimmer-line"
              [style.width.%]="cat.level"
              [style.background]="'linear-gradient(90deg,' + cat.color + ', #22d3a5)'"></div>
          </div>

          <div class="flex flex-wrap gap-2">
            @for (skill of cat.skills; track skill) {
              <span class="px-3 py-1 rounded-lg text-xs font-medium bg-white/5 text-[#a8adbd] border border-white/8 group-hover:border-white/15 transition-colors">
                {{ skill }}
              </span>
            }
          </div>
        </div>
      }
    </div>
    </div>
  </div>
</section>
